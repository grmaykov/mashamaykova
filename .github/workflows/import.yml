name: Inspect published portfolio
on:
  push:
    branches: [migration/complete-portfolio]
    paths: ['.github/workflows/import.yml']
permissions:
  contents: read
  pages: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read Pages configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/grmaykov/mashamaykova/pages
      - name: Check published files and HTTPS
        run: |
          python - <<'PY'
          import hashlib, json, urllib.request
          expected = {'index.html':'81b35426f5c907acc3bb4b74c9f90d870303eb73', 'app.js':'e7a5d6c7886bd82ac8936b890181faefa3370884', 'data.js':'a1abe66d749a45b513034d31bd410c96dd112056', 'style.css':'4ffc58c0acf079fc6ab1d8cb9e17ff039632b22b'}
          for scheme, host, path in [('http', 'mashamaykova.com', p) for p in expected]+[('https','mashamaykova.com','index.html'),('https','www.mashamaykova.com','index.html')]:
              url = scheme+'://'+host+'/'+path
              try:
                  with urllib.request.urlopen(url, timeout=30) as response:
                      data=response.read(); sha=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
                      print(json.dumps({'url':url,'status':response.status,'matches':sha==expected[path],'final_url':response.url}),flush=True)
              except Exception as error: print(json.dumps({'url':url,'error':str(error)}),flush=True)
          PY
