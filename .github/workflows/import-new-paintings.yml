name: Import 33 reviewed paintings
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-new-paintings.yml']
permissions:
  contents: write
concurrency:
  group: import-new-paintings
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image encoder
        run: python -m pip install Pillow==11.3.0
      - name: Import original images and verify checksums
        run: python .migration/import-new-paintings.py
      - name: Save new painting assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets
          git commit -m "Add 33 visually reviewed archive paintings and thumbnails"
          git push origin HEAD:main
