name: Import 34 reviewed archive works
on:
  push:
    branches: [main]
    paths: ['.github/workflows/import-archive34.yml']
permissions:
  contents: write
concurrency:
  group: import-archive34
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python .migration/import-archive34.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets
          git commit -m "Import 34 reviewed archive works with verified originals"
          git push origin HEAD:main
